name: NixOS

on:
  repository_dispatch:

jobs:
  build:
    runs-on: ${{ github.event.client_payload.runs-on }}

    strategy:
      fail-fast: true

    steps:
      - name: Add mask
        run: |
          echo "::add-mask::${{github.event.client_payload.repository}}"
          echo "::add-mask::${{github.event.client_payload.ref}}"
          echo "::add-mask::${{github.event.client_payload.hostname}}"

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: 'cleave' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.8.4
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes ca-derivations
            trusted-users = root runner
            trusted-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.c0d3m4513r.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.c0d3m4513r.com:DyXDxkX3kg03nPmwOiX536o2P2rPYY7wHDCbs27xya8=

      - name: Add SSH key
        env:
            SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
            mkdir -p /home/runner/.ssh
            # Replace example.com with the hostname of the machine
            # you're SSH-ing into
            ssh-keyscan cache.c0d3m4513r.com >> /home/runner/.ssh/known_hosts
            # DOKKU_SSH_KEY is the name of the repository secret
            echo "${{ secrets.CACHE_SSH_KEY }}" > /home/runner/.ssh/github_actions
            chmod 600 /home/runner/.ssh/github_actions
            ssh-agent -a $SSH_AUTH_SOCK > /dev/null
            ssh-add /home/runner/.ssh/github_actions


      - name: "Build NixOS config ❄️"
        env:
            SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          nix build .#nixosConfigurations.${{ github.event.client_payload.hostname }}.config.system.build.toplevel
          nix copy --to ssh://cache.c0d3m4513r.com .#nixosConfigurations.${{ github.event.client_payload.hostname }}.config.system.build.toplevel
